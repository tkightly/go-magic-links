version: "2"
linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - errorlint
    - misspell
    - sqlclosecheck
    - rowserrcheck
  settings:
    misspell:
      locale: UK
  exclusions:
    rules:
      # User-facing error messages are full sentences.
      - linters: [staticcheck]
        text: "ST1005"
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable: [gofmt]
