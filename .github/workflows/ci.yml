name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published vulnerabilities fail the build even
    # without code changes.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: tkightly/shared-workflows/.github/workflows/go-test.yml@v1.4.0

  lint:
    uses: tkightly/shared-workflows/.github/workflows/go-lint.yml@v1.4.0
